// Clusterfuck Saiga Rework - the five new upgrades are enabled for every technician.
// Technicians keep their own vanilla upgrade lists; this list is appended to each of them.

CFR_TechnicianUpgradeList : struct.begin
   CFR_Upgrade_CheekRiser : struct.begin
      UpgradePrototypeSID = CFR_Upgrade_CheekRiser
      Enabled = true
   struct.end
   CFR_Upgrade_FreeFloatHandguard : struct.begin
      UpgradePrototypeSID = CFR_Upgrade_FreeFloatHandguard
      Enabled = true
   struct.end
   CFR_Upgrade_MatchHandguard : struct.begin
      UpgradePrototypeSID = CFR_Upgrade_MatchHandguard
      Enabled = true
   struct.end
   CFR_Upgrade_HighPressureBolt : struct.begin
      UpgradePrototypeSID = CFR_Upgrade_HighPressureBolt
      Enabled = true
   struct.end
   CFR_Upgrade_APBarrel : struct.begin
      UpgradePrototypeSID = CFR_Upgrade_APBarrel
      Enabled = true
   struct.end
struct.end

TechnicianNPC : struct.begin {bpatch}
