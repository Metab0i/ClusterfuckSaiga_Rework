; WeaponSwayless — one section per supported weapon.
; Edit, then run Deploy.ps1. Paks are generated from these values (build-time).
;
;   enabled = 1 patch this weapon, 0 leave it vanilla
;   sway    = percent of idle sway removed (0-100)
;   setup   = WeaponGeneralSetup SID in the game files
;   dlc     = 1 if that setup ships in DLCGameData\DLC1, 0 if in GameData
;
; Optional per weapon:
;   attachment = attachment prototype that gets the same effects
;   hold_breath = 1 to allow hold-breath on that attachment

[clusterfuck]
label=Clusterfuck
setup=Gun_Sharpshooter_AR_GS
dlc=0
enabled=1
sway=80
attachment=M701_Scope
hold_breath=1

